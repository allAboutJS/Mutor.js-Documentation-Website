<nav class="space-y-6">
  {{ for group of nav }}
    <section>
      <h2 class="mb-3 px-3 text-xs font-semibold uppercase tracking-[0.18em] text-zinc-500">
        {{ group.label }}
      </h2>

      <ul class="space-y-1 border-l border-zinc-800/80">
        {{ for link of group.links }}
          <li>
            <a
              href="{{ link.href }}"
              {{ if link.external }}target="_blank" rel="noreferrer"{{ endif }}
              class="-ml-px block border-l px-3 py-2 text-sm transition-colors {{ link.href == currentPath ? 'border-violet-400 text-violet-300' : 'border-transparent text-zinc-400 hover:border-zinc-700 hover:text-zinc-100' }}"
            >
              {{ link.label }}
            </a>
          </li>
        {{ endfor }}
      </ul>
    </section>
  {{ endfor }}
</nav>
