<section class="py-24 border-t border-zinc-800/60">
  <div class="container mx-auto px-6">

    <div class="flex items-center gap-3 mb-5">
      <span class="block w-6 h-px bg-blue-500"></span>
      <span class="text-blue-500 text-xs font-semibold uppercase tracking-widest">Why Mutor.js</span>
    </div>

    <div class="mb-14">
      <h2 class="text-4xl lg:text-5xl font-bold tracking-[-0.03em] text-white mb-3">Engineered, not patched.</h2>
      <p class="text-zinc-400 text-base max-w-md">Every design decision in Mutor.js was made before a single line was written.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x divide-zinc-800/60 border border-zinc-800/60 rounded-xl overflow-hidden">
      {{ for feature of features }}
        <div class="group relative bg-zinc-950 hover:bg-zinc-900 p-9 transition-colors duration-200">
          <div class="absolute inset-0 bg-linear-to-br from-blue-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-xl"></div>
          <div class="relative">
            <div class="w-9 h-9 flex items-center justify-center bg-blue-500/10 border border-blue-500/20 rounded-lg text-blue-400 mb-6">
              <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M10 2l2.5 5.5L18 8.27l-4 3.87 1.09 5.5L10 14.77l-5.09 2.87L6 12.14 2 8.27l5.5-.77L10 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            </div>
            <h3 class="text-white font-semibold text-base mb-2.5 tracking-[-0.02em]">{{ feature.title }}</h3>
            <p class="text-zinc-400 text-sm leading-relaxed">{{ feature.description }}</p>
          </div>
        </div>
      {{ end }}
    </div>

  </div>
</section>
