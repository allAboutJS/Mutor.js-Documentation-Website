{{ if previousDoc || nextDoc }}
  <nav class="mt-14 grid gap-3 border-t border-zinc-800 pt-6 sm:grid-cols-2" aria-label="Doc pagination">
    {{ if previousDoc }}
      <a
        href="{{ previousDoc.href }}"
        class="group rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 transition hover:border-zinc-700 hover:bg-zinc-900"
      >
        <p class="mb-1 text-xs font-semibold uppercase tracking-[0.16em] text-zinc-500">Previous</p>
        <p class="text-sm font-medium text-zinc-100 transition-colors group-hover:text-violet-300">{{ previousDoc.label }}</p>
      </a>
    {{ else }}
      <div></div>
    {{ endif }}

    {{ if nextDoc }}
      <a
        href="{{ nextDoc.href }}"
        class="group rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 text-left transition hover:border-zinc-700 hover:bg-zinc-900 sm:text-right"
      >
        <p class="mb-1 text-xs font-semibold uppercase tracking-[0.16em] text-zinc-500">Next</p>
        <p class="text-sm font-medium text-zinc-100 transition-colors group-hover:text-violet-300">{{ nextDoc.label }}</p>
      </a>
    {{ endif }}
  </nav>
{{ endif }}
