<header class="sticky top-0 z-40 border-b border-zinc-800 bg-[#15161a]/95 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-400 items-center gap-3 px-4 sm:px-6">
    <div class="flex min-w-0 items-center gap-3 lg:w-72 lg:shrink-0">
      <button
        type="button"
        data-docs-open-nav
        class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-zinc-800 bg-zinc-900 text-zinc-200 transition hover:border-zinc-700 hover:bg-zinc-800 lg:hidden"
        aria-label="Open documentation navigation"
      >
        <span class="text-lg leading-none">☰</span>
      </button>

      <a href="/" class="flex min-w-0 items-center gap-2 text-zinc-100">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-zinc-100 text-xs font-bold text-zinc-950 font-mono">\{{.}}</div>
        <span class="truncate text-sm font-semibold tracking-tight">Mutor.js</span>
      </a>
    </div>

    <div class="hidden min-w-0 flex-1 justify-center md:flex">
      <div class="relative w-full max-w-md" data-docs-search-root data-search-mode="dropdown">
        <label for="docs-search-input-desktop" class="sr-only">Search documentation</label>
        <input
          id="docs-search-input-desktop"
          data-docs-search-input
          type="search"
          placeholder="Search"
          autocomplete="off"
          class="h-11 w-full rounded-xl border border-zinc-800 bg-zinc-900 pl-11 pr-20 text-sm text-zinc-100 outline-none transition placeholder:text-zinc-500 focus:border-violet-500/50 focus:bg-zinc-900 focus:ring-2 focus:ring-violet-500/20"
        >
        <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-zinc-500">⌕</span>
        <span class="pointer-events-none absolute inset-y-0 right-0 hidden items-center pr-3 text-[11px] font-medium text-zinc-500 lg:flex">
          <kbd class="rounded-md border border-zinc-700 bg-zinc-950 px-2 py-1 font-mono">Ctrl</kbd>
          <span class="mx-1">K</span>
        </span>

        <div data-docs-search-panel class="absolute inset-x-0 top-[calc(100%+0.5rem)] hidden overflow-hidden rounded-2xl border border-zinc-800 bg-[#17181d] shadow-2xl shadow-black/40">
          <p data-docs-search-status class="border-b border-zinc-800 px-4 py-3 text-xs text-zinc-500">Start typing to search the documentation.</p>
          <div data-docs-search-results class="max-h-96 overflow-y-auto p-2"></div>
        </div>
      </div>
    </div>

    <div class="ml-auto flex items-center gap-2">
      <button
        type="button"
        data-docs-open-search
        class="inline-flex h-9 items-center justify-center rounded-lg border border-zinc-800 bg-zinc-900 px-3 text-sm text-zinc-200 transition hover:border-zinc-700 hover:bg-zinc-800 md:hidden"
      >
        Search
      </button>

      <a href="https://playground.mutorjs.sellazzo.com" class="hidden text-sm text-zinc-400 transition hover:text-zinc-100 sm:inline-block">Playground</a>
      <a href="https://github.com/allAboutJS/Mutor.js" class="inline-flex h-9 items-center justify-center rounded-lg border border-zinc-800 bg-zinc-900 px-3 text-sm text-zinc-200 transition hover:border-zinc-700 hover:bg-zinc-800">GitHub</a>
    </div>
  </div>
</header>
