<aside
  id="docs-sidebar"
  class="hidden md:block sticky top-14 z-30 h-[calc(100vh-3.5rem)] max-w-2xs px-6 overflow-y-auto pt-10 pb-6 pr-6 border-r border-zinc-900/60"
>
  <nav class="space-y-8">
    {{ for group of nav }}
    <div>
      <h4
        class="text-sm font-bold uppercase mb-3"
      >
        {{ group.heading }}
      </h4>

      <div class="flex flex-col gap-1 border-l border-zinc-800 pl-3">
        {{ for link of group.links }}
        <a
          href="{{ link.href }}"
          class="{{ link.href == path.replace('@/components', '') ? 'text-blue-400' : 'text-zinc-300' }} hover: text-sm py-1.5 transition-colors duration-150"
        >
          {{ link.title }}
        </a>
        {{ end }}
      </div>
    </div>
    {{ end }}
  </nav>
</aside>
