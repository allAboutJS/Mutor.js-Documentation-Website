<aside
  id="docs-sidebar"
  class="hidden md:block sticky top-14 z-30 h-[calc(100vh-3.5rem)] max-w-2xs px-6 overflow-y-auto pt-10 pb-6 pr-6 border-r border-zinc-900/60"
>
  <nav class="space-y-8">
    {{ for group of nav }}
    <div>
      <h4
        class="text-xs font-bold tracking-wide uppercase mb-3 {{ group.id === 'core-guide' ? 'text-white' : 'text-zinc-400' }}"
      >
        {{ group.heading }}
      </h4>

      <div class="flex flex-col gap-1 border-l border-zinc-800 pl-3">
        {{ for link of group.links }}
        <a
          href="{{ link.href }}"
          class="text-zinc-500 hover:text-white text-sm py-1.5 transition-colors duration-150"
        >
          {{ link.title }}
        </a>
        {{ end }}
      </div>
    </div>
    {{ end }}
  </nav>
</aside>
