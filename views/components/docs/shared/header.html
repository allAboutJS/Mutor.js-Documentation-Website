<header
  class="sticky top-0 z-50 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800/60 w-full"
>
  <div class="px-6 flex items-center justify-between h-14">
    <a href="/" class="flex items-center gap-2.5">
      <div
        class="w-7 h-7 bg-blue-600 rounded-md flex items-center justify-center font-bold shrink-0"
      >
        M
      </div>
      <span class="font-semibold text-sm tracking-[-0.02em]"
        >Mutor<span class="text-blue-500">.js</span></span
      >
    </a>

    <div class="flex items-center gap-2">
      <a
        href="https://github.com/allAboutJS/Mutor.js"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-1.5 hover: font-medium px-3.5 py-1.5 border border-zinc-700/60 hover:border-zinc-600 rounded-lg transition-all duration-150"
      >
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
        GitHub
      </a>

      <button onclick="toggleMobileMenu()" class="md:hidden p-1.5  hover: border border-zinc-800 rounded-md hover:bg-zinc-900 transition-colors duration-150" aria-label="Toggle Navigation Menu">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2.5 4.75h11M2.5 8h11M2.5 11.25h11" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div
  id="mobile-menu-drawer"
  class="fixed inset-0 top-14 z-40 w-full h-[calc(100vh-3.5rem)] bg-zinc-950 border-t border-zinc-900 overflow-y-auto p-6 transition-transform duration-200 ease-in-out translate-x-full md:hidden"
>
  <nav class="space-y-8">
    {{ for group of nav }}
    <div>
      <h4 class="text-sm font-bold uppercase mb-3 flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-sm {{ group.color }}"></span>
        {{ group.heading }}
      </h4>

      <div class="flex flex-col gap-1 border-l border-zinc-800 pl-4">
        {{ for link of group.links }}
        <a
          href="{{ link.href }}"
          onclick="toggleMobileMenu()"
          class="text-zinc-300 hover:text-zinc-200 py-2 transition-colors duration-150"
        >
          {{ link.title }}
        </a>
        {{ end }}
      </div>
    </div>
    {{ end }}
  </nav>
</div>

<script>
  function toggleMobileMenu() {
    const menuDrawer = document.getElementById("mobile-menu-drawer");
    const body = document.body;

    if (menuDrawer.classList.contains("translate-x-full")) {
      menuDrawer.classList.remove("translate-x-full");
      menuDrawer.classList.add("translate-x-0");
      body.classList.add("overflow-hidden");
    } else {
      menuDrawer.classList.remove("translate-x-0");
      menuDrawer.classList.add("translate-x-full");
      body.classList.remove("overflow-hidden");
    }
  }

  toggleMobileMenu;
</script>
