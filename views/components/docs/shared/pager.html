<div
  id="docs-pager"
  class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-zinc-900 pt-10 mt-16 font-medium"
>
  {{ if prevPage }}
  <a
    id="pager-prev"
    href="{{ prevPage.path }}"
    class="bg-zinc-950/40 border border-zinc-900 p-5 rounded-xl hover:bg-zinc-900/30 hover:border-zinc-800 transition-all duration-150"
  >
    <span class="text-[10px] uppercase text-zinc-300 r block mb-1"
      >&larr; Previous</span
    >
    <span
      id="pager-prev-title"
      class="text-sm font-semibold  tracking-[-0.01em] group-hover:text-blue-500 transition-colors block"
      >{{ prevPage.title }}</span
    >
  </a>
  {{ else }}
  <div></div>
  {{ end }}

  {{ if nextPage }}
  <a
    id="pager-next"
    href="{{ nextPage.path }}"
    class="bg-zinc-950/40 border border-zinc-900 p-5 rounded-xl hover:bg-zinc-900/30 hover:border-zinc-800 transition-all duration-150"
  >
    <span class="text-[10px] uppercase text-zinc-300 r block mb-1"
      >&rarr; Next</span
    >
    <span
      id="pager-prev-title"
      class="text-sm font-semibold  tracking-[-0.01em] group-hover:text-blue-500 transition-colors block"
      >{{ nextPage.title }}</span
    >
  </a>
  {{ else }}
  <div></div>
  {{ end }}
</div>
