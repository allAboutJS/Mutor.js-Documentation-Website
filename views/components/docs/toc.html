{{ if tocHeadings && tocHeadings.length }}
  <aside class="hidden xl:block xl:w-64 2xl:w-72">
    <div class="sticky top-24 pl-6">
      <div class="border-l border-zinc-800 pl-5">
        <p class="mb-4 text-sm font-semibold text-zinc-300">On this page</p>

        <nav>
          <ul class="space-y-3 text-sm">
            {{ for heading of tocHeadings }}
              <li>
                <a
                  href="#{{ heading.id }}"
                  class="block text-zinc-500 transition hover:text-violet-300 {{ heading.level == 3 ? 'pl-4 text-[13px]' : '' }}"
                >
                  {{ heading.title }}
                </a>
              </li>
            {{ endfor }}
          </ul>
        </nav>
      </div>
    </div>
  </aside>
{{ endif }}
